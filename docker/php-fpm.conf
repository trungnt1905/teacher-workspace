; Small pool for Render Free (~512MB RAM, one teacher). Workers run as www-data.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 200

; Must be > TIMETABLE_PROCESS_TIMEOUT (60s) so Laravel can return a structured timeout error.
request_terminate_timeout = 90s

; Forward Laravel/PHP output to the container log; keep the environment (APP_KEY, ADMIN_*…).
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
