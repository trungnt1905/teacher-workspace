; Production PHP settings (DETAIL_DESIGN §13.3). Upload limits must match nginx client_max_body_size.
upload_max_filesize = 6M
post_max_size = 12M
max_file_uploads = 2
memory_limit = 256M
max_execution_time = 90

expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
